<!doctype html>
<html lang="ar">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>CSS Cassette</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Aref Ruqaa = handwritten Ruqʿah style like the brand name; Noto Naskh = clean print for the company line -->
		<!-- <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet"> -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Changa:wght@500..800&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div
			class="cassette"
			role="button"
			tabindex="0"
			aria-pressed="true"
			aria-label="Play / pause cassette">
			<span class="screw tl"></span><span class="screw tr"></span>
			<span class="screw bl"></span><span class="screw br"></span>

			<div class="label">
				<span class="title">قاريونس</span>
				<span class="company">الشركة العامة للالكترونات</span>
				<span class="duration"><b>60</b> دقيقة</span>
				<span class="side">2</span>

				<div class="window">
					<span class="reel left"></span>
					<span class="viewport"></span>
					<span class="reel right"></span>
				</div>
			</div>

			<div class="bottom">
				<span class="hole"></span>
				<span class="hole sq"></span>
				<span class="hole sq"></span>
				<span class="hole"></span>
			</div>
		</div>

		<script src="script.js" defer></script>
	</body>
</html>
